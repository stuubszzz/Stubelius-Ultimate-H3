# Push a tag (git tag v0.8.0 && git push origin v0.8.0) -> a release with the free download:
# Stubelius_Ultimate_H3.zip = the example workflow + INSTALL.txt. The landing page links
# releases/latest/download/Stubelius_Ultimate_H3.zip, so it always serves the newest one.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the download
        run: |
          mkdir -p dist/Stubelius_Ultimate_H3
          cp example_workflows/Stubelius_Ultimate_H3.json INSTALL.txt dist/Stubelius_Ultimate_H3/
          cd dist && zip -r Stubelius_Ultimate_H3.zip Stubelius_Ultimate_H3
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/Stubelius_Ultimate_H3.zip
          --title "Ultimate H3 $GITHUB_REF_NAME"
          --notes "Workflow + install notes. Install or update the nodes from this repository - see INSTALL.txt."
